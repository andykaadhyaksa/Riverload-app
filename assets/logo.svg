<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5c8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b89e;stop-opacity:1" />
    </linearGradient>
    <clipPath id="hexClip">
      <polygon points="100,10 182,55 182,145 100,190 18,145 18,55"/>
    </clipPath>
  </defs>

  <!-- Hexagon background -->
  <polygon points="100,10 182,55 182,145 100,190 18,145 18,55"
    fill="#071520" stroke="#00e5c8" stroke-width="2" opacity="0.95"/>

  <!-- River wave lines -->
  <g clip-path="url(#hexClip)">
    <path d="M20,95 Q50,80 80,95 Q110,110 140,95 Q170,80 195,95"
      fill="none" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M20,110 Q55,95 85,110 Q115,125 145,110 Q170,97 195,110"
      fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M20,122 Q60,110 90,122 Q120,134 150,122 Q173,113 195,122"
      fill="none" stroke="url(#waveGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>

    <!-- Droplet / flow arrow -->
    <path d="M100,50 C100,50 78,72 78,84 C78,96.6 88.1,107 100,107 C111.9,107 122,96.6 122,84 C122,72 100,50 100,50 Z"
      fill="#00e5c8" opacity="0.18"/>
    <path d="M100,58 C100,58 84,76 84,85 C84,93.8 91.2,101 100,101 C108.8,101 116,93.8 116,85 C116,76 100,58 100,58 Z"
      fill="none" stroke="#00e5c8" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Hex border glow -->
  <polygon points="100,10 182,55 182,145 100,190 18,145 18,55"
    fill="none" stroke="#00e5c8" stroke-width="1" opacity="0.3"/>
</svg>
